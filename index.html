<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>LINE AI Chatbot Management System</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #162033;
      --muted: #69758b;
      --line: #e5e9f2;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #15976b;
      --warning: #b7791f;
      --danger: #dc3c4b;
      --sidebar: #101827;
      --sidebar-text: #c3ccda;
      --sidebar-active: #27354b;
      --radius: 15px;
      --shadow: 0 8px 26px rgba(25, 38, 65, .055);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
      font-size: 14px;
    }

    button, input, textarea, select { font: inherit; }

    button { cursor: pointer; }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 252px;
      flex: 0 0 252px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      overflow-y: auto;
      background: var(--sidebar);
      color: white;
      padding: 21px 13px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 4px 10px 22px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 16px;
    }

    .brand-mark {
      width: 41px;
      height: 41px;
      border-radius: 13px;
      background: linear-gradient(135deg, #7766ff, #36b5c5);
      display: grid;
      place-items: center;
      font-size: 21px;
      box-shadow: 0 5px 20px rgba(91, 81, 232, .3);
    }

    .brand-title { font-weight: 800; font-size: 13px; line-height: 1.45; }
    .brand-sub { color: #93a0b5; font-size: 10px; margin-top: 2px; }

    .nav-label {
      padding: 13px 12px 6px;
      color: #8390a7;
      font-size: 10px;
      letter-spacing: .11em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .nav-btn {
      border: 0;
      width: 100%;
      color: var(--sidebar-text);
      background: transparent;
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      margin: 2px 0;
      transition: background .15s, color .15s;
    }

    .nav-btn:hover { background: rgba(255,255,255,.06); color: white; }
    .nav-btn.active { background: var(--sidebar-active); color: white; }
    .nav-icon { width: 21px; text-align: center; font-size: 17px; }
    .nav-name { flex: 1; font-size: 12px; font-weight: 600; }

    .sidebar-bottom {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,.1);
      padding: 15px 9px 3px;
      color: #98a5ba;
      font-size: 11px;
      line-height: 1.7;
    }

    .main {
      min-width: 0;
      flex: 1;
      margin-left: 252px;
    }

    .topbar {
      background: rgba(255,255,255,.93);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 15;
      min-height: 72px;
      padding: 13px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(14px);
    }

    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .page-heading { min-width: 0; }
    .page-title { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
    .page-subtitle { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 8px 11px;
      color: var(--muted);
      background: white;
      font-size: 11px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      background: #a1a9b8;
    }

    .dot.ok { background: #13a66e; }
    .dot.bad { background: #d74453; }
    .dot.loading { background: #e5a329; }

    .mobile-menu { display: none !important; }

    .content { padding: 26px 28px 40px; max-width: 1600px; margin: 0 auto; }
    .page-tools { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .page-tools .grow { flex: 1; }

    .btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 9px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: .15s;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px #16203312; }
    .btn-primary { color: white; background: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; border-color: var(--success); }
    .btn-danger { background: white; color: var(--danger); border-color: #f3c9ce; }
    .btn-soft { background: #efefff; color: var(--primary); border-color: #e3e1ff; }
    .btn-small { padding: 6px 9px; font-size: 11px; border-radius: 7px; }
    .btn-icon { width: 34px; height: 34px; padding: 0; font-size: 15px; }

    .grid { display: grid; gap: 16px; }
    .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .card-body { padding: 19px; }
    .card-header { padding: 17px 19px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-title { margin: 0; font-size: 14px; font-weight: 800; }
    .card-desc { color: var(--muted); font-size: 11px; margin-top: 5px; line-height: 1.65; }
    .stat-card { padding: 18px 19px; }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 600; }
    .stat-value { font-size: 29px; line-height: 1.3; font-weight: 800; margin: 11px 0 6px; letter-spacing: -.04em; }
    .stat-note { color: var(--muted); font-size: 10px; }
    .stat-icon { float: right; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: #efefff; }
    .stat-icon.green { background: #e3f7ee; }
    .stat-icon.orange { background: #fff1dc; }
    .stat-icon.blue { background: #e6f2ff; }

    .section-gap { margin-top: 18px; }
    .muted { color: var(--muted); }
    .tiny { font-size: 10px; }
    .small { font-size: 11px; }
    .strong { font-weight: 800; }
    .flex { display: flex; }
    .align-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .wrap { flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 13px; }
    .divider { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label { color: #445067; font-size: 11px; font-weight: 800; }
    .field .help { color: var(--muted); font-size: 10px; line-height: 1.6; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid #dbe1eb;
      background: #fff;
      color: var(--text);
      border-radius: 9px;
      padding: 10px 11px;
      outline: none;
      min-height: 38px;
      font-size: 12px;
    }

    .textarea { min-height: 120px; resize: vertical; line-height: 1.65; }
    .textarea.code { font: 12px/1.65 Consolas, "Courier New", monospace; }
    .input:focus, .select:focus, .textarea:focus { border-color: #9690ff; box-shadow: 0 0 0 3px #625bff14; }
    .input::placeholder, .textarea::placeholder { color: #a0a8b6; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .span-2 { grid-column: span 2; }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { text-align: left; color: #6d7890; text-transform: uppercase; letter-spacing: .05em; font-size: 9px; font-weight: 800; background: #f8f9fc; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #edf0f5; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafbff; }
    .table-primary { font-weight: 800; color: #273349; max-width: 240px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .table-secondary { color: var(--muted); font-size: 10px; margin-top: 4px; max-width: 260px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .table-actions { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .check { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 30px; padding: 4px 8px; font-size: 10px; font-weight: 800; background: #eff2f7; color: #5c667a; white-space: nowrap; }
    .badge.green { background: #e3f8ee; color: #13845e; }
    .badge.red { background: #ffebee; color: #bd3343; }
    .badge.orange { background: #fff3df; color: #9a610b; }
    .badge.blue { background: #e6f0ff; color: #2f5ec3; }
    .badge.purple { background: #efedff; color: #5f51ce; }

    .avatar { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #ecebff; color: #5045c6; font-weight: 800; overflow: hidden; flex: 0 0 auto; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .person { display: flex; align-items: center; gap: 9px; min-width: 160px; }
    .person-name { font-size: 11px; font-weight: 800; }
    .person-id { font-family: Consolas, monospace; font-size: 9px; color: var(--muted); margin-top: 3px; }

    .empty { padding: 45px 20px; text-align: center; color: var(--muted); }
    .empty-icon { font-size: 31px; opacity: .7; margin-bottom: 10px; }
    .empty-title { font-weight: 800; color: var(--text); margin-bottom: 5px; }
    .loading { padding: 40px; text-align: center; color: var(--muted); }
    .spinner { width: 20px; height: 20px; border: 2px solid #dce1ed; border-top-color: var(--primary); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .notice { border-radius: 10px; padding: 11px 13px; background: #f1f4ff; border: 1px solid #e2e6ff; color: #4854a0; font-size: 11px; line-height: 1.7; }
    .notice.warn { background: #fff8e9; border-color: #ffedc1; color: #8a6113; }
    .notice.danger { background: #fff0f1; border-color: #ffd6da; color: #a42c3c; }
    .notice.success { background: #e9faf2; border-color: #d2f3e3; color: #16734f; }

    .toolbar-search { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .toolbar-search .input { min-width: 180px; }
    .searchbox { position: relative; }
    .searchbox input { padding-left: 33px; }
    .search-icon { position: absolute; left: 11px; top: 10px; color: #8490a3; }

    .friends-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 15px; }
    .selected-bar { background: #efefff; border: 1px solid #dfddff; border-radius: 11px; padding: 11px 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 13px; }
    .selected-count { font-size: 12px; font-weight: 800; color: #4c42bb; }

    .split { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 450px; }
    .split-list { border-right: 1px solid var(--line); max-height: 650px; overflow-y: auto; }
    .split-detail { min-width: 0; }
    .conversation-item { padding: 13px 15px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .conversation-item:hover { background: #f8f9ff; }
    .conversation-item.active { background: #eeefff; border-left: 3px solid var(--primary); }
    .conversation-main { display: flex; align-items: center; gap: 9px; }
    .conversation-last { margin: 7px 0 0 43px; color: var(--muted); font-size: 10px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .conversation-time { font-size: 9px; color: var(--muted); }

    .messages { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-height: 330px; max-height: 520px; overflow-y: auto; background: #f9faff; }
    .message-row { display: flex; }
    .message-row.out { justify-content: flex-end; }
    .message-bubble { max-width: min(75%, 520px); padding: 11px 13px; border-radius: 13px; background: white; border: 1px solid #e4e8f1; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }
    .message-row.out .message-bubble { color: white; background: #5650cf; border-color: #5650cf; border-bottom-right-radius: 4px; }
    .message-meta { font-size: 9px; margin-top: 5px; opacity: .7; }
    .reply-bar { display: flex; gap: 8px; padding: 13px; border-top: 1px solid var(--line); }
    .reply-bar .input { flex: 1; }

    .template-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: white; }
    .template-name { font-size: 12px; font-weight: 800; margin-bottom: 5px; }
    .template-desc { color: var(--muted); font-size: 10px; line-height: 1.6; }
    .json-preview { background: #101827; color: #d7e3f9; border-radius: 10px; padding: 14px; font: 11px/1.7 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow-y: auto; }

    .chart-bars { display: flex; gap: 9px; height: 175px; align-items: end; padding: 13px 3px 2px; border-bottom: 1px solid var(--line); }
    .chart-col { display: flex; flex: 1; min-width: 0; height: 100%; flex-direction: column; justify-content: end; align-items: center; gap: 7px; }
    .chart-value { font-size: 9px; color: var(--muted); }
    .chart-bar { width: min(100%, 32px); border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #8175ff, #554bd1); min-height: 2px; }
    .chart-label { font-size: 9px; color: var(--muted); white-space: nowrap; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(8,15,30,.52); display: none; align-items: center; justify-content: center; z-index: 100; padding: 18px; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(760px, 100%); max-height: 90vh; overflow: hidden; background: white; border-radius: 16px; box-shadow: 0 24px 80px rgba(0,0,0,.25); display: flex; flex-direction: column; }
    .modal-header { padding: 17px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .modal-title { font-weight: 800; font-size: 15px; }
    .modal-body { padding: 20px; overflow-y: auto; }
    .modal-footer { padding: 13px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
    .modal-close { border: 0; background: transparent; font-size: 22px; color: var(--muted); }
    .toast-area { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 36px)); }
    .toast { background: #162033; color: white; box-shadow: 0 7px 25px #0002; border-radius: 10px; padding: 13px 15px; font-size: 12px; line-height: 1.6; animation: enter .15s ease-out; }
    .toast.error { background: #a72c3b; }
    .toast.success { background: #13754f; }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    .overlay-sidebar { display: none; }

    @media (max-width: 1200px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content { padding: 22px; }
      .topbar { padding: 13px 22px; }
    }

    @media (max-width: 850px) {
      .sidebar { transform: translateX(-100%); transition: transform .2s; }
      .sidebar.open { transform: translateX(0); }
      .overlay-sidebar.open { display: block; position: fixed; inset: 0; background: #0e16264d; z-index: 25; }
      .main { margin-left: 0; }
      .mobile-menu { display: inline-flex !important; }
      .topbar { padding: 12px 16px; }
      .content { padding: 17px 15px 32px; }
      .page-title { font-size: 17px; }
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .split { grid-template-columns: 1fr; }
      .split-list { max-height: 270px; border-right: 0; border-bottom: 1px solid var(--line); }
    }

    @media (max-width: 560px) {
      .stats-grid, .grid-4 { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-value { font-size: 23px; }
      .stat-icon { width: 33px; height: 33px; font-size: 15px; }
      .topbar { align-items: flex-start; }
      .connection { display: none; }
      .top-actions .btn span.btn-label { display: none; }
      .page-title { font-size: 15px; }
      .form-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: span 1; }
      .page-tools { align-items: stretch; }
      .toolbar-search { width: 100%; }
      .toolbar-search .input { min-width: 0; }
      .message-bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="overlay-sidebar" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-title">LINE AI CHATBOT</div>
          <div class="brand-sub">Management System v3.0</div>
        </div>
      </div>

      <div class="nav-label">ภาพรวม</div>
      <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')"><span class="nav-icon">▦</span><span class="nav-name">Dashboard</span></button>
      <button class="nav-btn" data-page="analytics" onclick="navigate('analytics')"><span class="nav-icon">▥</span><span class="nav-name">Analytics & Reports</span></button>

      <div class="nav-label">แชตและลูกค้า</div>
      <button class="nav-btn" data-page="inbox" onclick="navigate('inbox')"><span class="nav-icon">▤</span><span class="nav-name">Chat Inbox</span></button>
      <button class="nav-btn" data-page="friends" onclick="navigate('friends')"><span class="nav-icon">♙</span><span class="nav-name">Friends / Customers</span></button>
      <button class="nav-btn" data-page="handover" onclick="navigate('handover')"><span class="nav-icon">⇄</span><span class="nav-name">Admin Handover</span></button>

      <div class="nav-label">AI และเนื้อหา</div>
      <button class="nav-btn" data-page="settings" onclick="navigate('settings')"><span class="nav-icon">✧</span><span class="nav-name">AI Chat Settings</span></button>
      <button class="nav-btn" data-page="prompts" onclick="navigate('prompts')"><span class="nav-icon">≡</span><span class="nav-name">Prompt & Versions</span></button>
      <button class="nav-btn" data-page="knowledge" onclick="navigate('knowledge')"><span class="nav-icon">⌕</span><span class="nav-name">Knowledge Base</span></button>
      <button class="nav-btn" data-page="profiles" onclick="navigate('profiles')"><span class="nav-icon">◈</span><span class="nav-name">AI Profiles</span></button>
      <button class="nav-btn" data-page="welcome" onclick="navigate('welcome')"><span class="nav-icon">☀</span><span class="nav-name">Welcome Flow</span></button>
      <button class="nav-btn" data-page="automations" onclick="navigate('automations')"><span class="nav-icon">⚡</span><span class="nav-name">Automation Rules</span></button>
      <button class="nav-btn" data-page="safety" onclick="navigate('safety')"><span class="nav-icon">◇</span><span class="nav-name">Safety Controls</span></button>

      <div class="nav-label">ข้อความและแคมเปญ</div>
      <button class="nav-btn" data-page="flex" onclick="navigate('flex')"><span class="nav-icon">▧</span><span class="nav-name">Flex Message Studio</span></button>
      <button class="nav-btn" data-page="campaigns" onclick="navigate('campaigns')"><span class="nav-icon">➤</span><span class="nav-name">Broadcast & Campaigns</span></button>
      <button class="nav-btn" data-page="loading" onclick="navigate('loading')"><span class="nav-icon">◌</span><span class="nav-name">Typing / Loading</span></button>
      <button class="nav-btn" data-page="richmenus" onclick="navigate('richmenus')"><span class="nav-icon">▦</span><span class="nav-name">Rich Menu</span></button>

      <div class="nav-label">ระบบ</div>
      <button class="nav-btn" data-page="channels" onclick="navigate('channels')"><span class="nav-icon">◎</span><span class="nav-name">LINE Channels / OA</span></button>
      <button class="nav-btn" data-page="jobs" onclick="navigate('jobs')"><span class="nav-icon">◷</span><span class="nav-name">Scheduled Jobs</span></button>
      <button class="nav-btn" data-page="logs" onclick="navigate('logs')"><span class="nav-icon">▤</span><span class="nav-name">System Logs</span></button>

      <div class="sidebar-bottom">
        <div><span class="dot" id="sideStatusDot"></span> <span id="sideStatusText">ยังไม่ได้เชื่อมต่อ API</span></div>
        <div style="margin-top:7px">GitHub Pages · Apps Script</div>
        <div>Cloudflare Worker Gateway</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-icon mobile-menu" onclick="toggleSidebar(true)" aria-label="เปิดเมนู">☰</button>
          <div class="page-heading">
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
            <div class="page-subtitle" id="pageSubtitle">ภาพรวมระบบ LINE AI Chatbot</div>
          </div>
        </div>
        <div class="top-actions">
          <div class="connection" id="connectionPill"><span class="dot" id="connectionDot"></span><span id="connectionText">ยังไม่เชื่อมต่อ</span></div>
          <button class="btn" onclick="checkConnection()">⟳ <span class="btn-label">ทดสอบ API</span></button>
          <button class="btn btn-primary" onclick="openApiSettings()">⚙ <span class="btn-label">ตั้งค่า API</span></button>
        </div>
      </header>

      <section class="content" id="mainContent">
        <div class="loading"><span class="spinner"></span> กำลังเตรียมระบบ...</div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">หน้าต่าง</div>
        <button class="modal-close" onclick="closeModal()" aria-label="ปิด">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" id="modalSaveButton" onclick="saveModal()">บันทึก</button>
      </div>
    </div>
  </div>

  <div class="toast-area" id="toastArea"></div>

  <script>
    "use strict";

    const API_STORAGE_KEY = "line_ai_chatbot_worker_url_v1";

    const PAGE_META = {
      dashboard:  ["Dashboard", "ภาพรวมระบบ LINE AI Chatbot"],
      analytics:  ["Analytics & Reports", "สถิติข้อความ ผู้ติดตาม และแคมเปญ"],
      inbox:      ["Chat Inbox", "ดูบทสนทนาและตอบกลับลูกค้า"],
      friends:    ["Friends / Customers", "รายชื่อผู้ติดตาม ค้นหา เลือกหลายคน และส่ง Flex"],
      handover:   ["Admin Handover", "จัดการการส่งต่อบทสนทนาให้เจ้าหน้าที่"],
      settings:   ["AI Chat Settings", "การตั้งค่าระบบ AI และทดสอบการตอบกลับ"],
      prompts:    ["Prompt & Versions", "จัดการ System Prompt และเวอร์ชัน"],
      knowledge:  ["Knowledge Base", "ข้อมูลอ้างอิงสำหรับ AI"],
      profiles:   ["AI Profiles", "โปรไฟล์ โมเดล และพฤติกรรม AI"],
      welcome:    ["Welcome Flow", "ข้อความต้อนรับและ Flow เมื่อมีผู้ติดตามใหม่"],
      automations:["Automation Rules", "กฎตอบกลับและการทำงานอัตโนมัติ"],
      safety:     ["Safety Controls", "กฎความปลอดภัยและการส่งต่อเจ้าหน้าที่"],
      flex:       ["Flex Message Studio", "สร้าง Template และส่ง Flex ให้เพื่อนที่เลือก"],
      campaigns:  ["Broadcast & Campaigns", "แคมเปญส่งข้อความและติดตามสถานะ"],
      loading:    ["Typing / Loading", "ทดสอบ LINE Loading Indicator"],
      richmenus:  ["Rich Menu Management", "สร้างเมนูและจัดการเมนู LINE OA"],
      channels:   ["LINE Channels / OA", "จัดการ Channel และทดสอบการเชื่อมต่อ"],
      jobs:       ["Scheduled Jobs", "งานตามเวลาและการบำรุงรักษา"],
      logs:       ["System Logs", "ตรวจสอบบันทึกระบบและส่งออก CSV"]
    };

    const TABLE_COLUMNS = {
      ChatSessions: ["displayName", "userId", "status", "lastMessage", "lastMessageAt"],
      HandoverQueue: ["displayName", "userId", "reason", "status", "assignedTo", "createdAt"],
      Prompts: ["name", "version", "active", "description", "updatedAt"],
      PromptVersions: ["promptName", "version", "note", "createdAt", "createdBy"],
      KnowledgeBase: ["title", "category", "keywords", "enabled", "updatedAt"],
      Documents: ["title", "source", "mimeType", "status", "updatedAt"],
      FlexTemplates: ["name", "category", "altText", "enabled", "updatedAt"],
      WelcomeFlow: ["name", "triggerType", "messageType", "enabled", "priority"],
      AutomationRules: ["name", "triggerType", "keyword", "actionType", "enabled", "priority"],
      Campaigns: ["name", "status", "messageType", "targetType", "sentCount", "totalRecipients", "scheduledAt"],
      BroadcastLogs: ["campaignName", "timestamp", "recipientCount", "status", "error"],
      AIProfiles: ["name", "model", "temperature", "enabled", "updatedAt"],
      Channels: ["name", "channelId", "enabled", "isDefault", "description"],
      RichMenus: ["name", "richMenuId", "chatBarText", "imageUploaded", "enabled"],
      SafetyRules: ["name", "ruleType", "value", "enabled"],
      ScheduledJobs: ["name", "jobType", "status", "runAt", "attempts", "lastError"],
      UsageStats: ["date", "metric", "value"],
      WebhookEvents: ["timestamp", "eventType", "userId", "status", "error"],
      AdminLogs: ["timestamp", "action", "tableName", "recordId", "result"],
      SystemLogs: ["timestamp", "level", "source", "message"]
    };

    let workerBase = localStorage.getItem(API_STORAGE_KEY) || "";
    let currentPage = "dashboard";
    let cache = {};
    let selectedUserIds = new Set();
    let friendsOffset = 0;
    let friendsSearchTimer = null;
    let activeConversationUser = "";
    let currentModalSave = null;
    let isWorking = false;

    function esc(value) {
      const s = value === null || value === undefined ? "" : String(value);
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function escAttr(value) {
      return esc(value).replace(/`/g, "&#96;");
    }

    function pretty(value) {
      if (value === null || value === undefined || value === "") return "—";
      if (typeof value === "object") return JSON.stringify(value);
      return String(value);
    }

    function shortText(value, limit = 90) {
      const text = pretty(value);
      return text.length > limit ? text.slice(0, limit) + "…" : text;
    }

    function fmtDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return String(value);
      return date.toLocaleString("th-TH", {
        dateStyle: "short",
        timeStyle: "short"
      });
    }

    function fmtNumber(value) {
      return Number(value || 0).toLocaleString("th-TH");
    }

    function boolBadge(value) {
      const yes = value === true || String(value).toLowerCase() === "true" || String(value) === "1";
      return yes
        ? '<span class="badge green">เปิดใช้งาน</span>'
        : '<span class="badge">ปิดใช้งาน</span>';
    }

    function statusBadge(value) {
      const text = String(value || "ไม่ระบุ");
      const lower = text.toLowerCase();
      let color = "";
      if (["active", "sent", "completed", "success", "open"].includes(lower)) color = "green";
      else if (["failed", "error", "blocked", "cancelled"].includes(lower)) color = "red";
      else if (["queued", "scheduled", "partial", "pending", "handover", "sending"].includes(lower)) color = "orange";
      else if (["received", "enabled"].includes(lower)) color = "blue";
      return '<span class="badge ' + color + '">' + esc(text) + '</span>';
    }

    function toast(message, type = "") {
      const node = document.createElement("div");
      node.className = "toast " + type;
      node.textContent = message;
      document.getElementById("toastArea").appendChild(node);
      setTimeout(() => node.remove(), 4600);
    }

    function setApiStatus(status, text) {
      const dot = document.getElementById("connectionDot");
      const sideDot = document.getElementById("sideStatusDot");
      dot.className = "dot " + status;
      sideDot.className = "dot " + status;
      document.getElementById("connectionText").textContent = text;
      document.getElementById("sideStatusText").textContent = text;
    }

    function apiEndpoint() {
      return workerBase.replace(/\/+$/, "") + "/api";
    }

    async function api(action, payload = {}) {
      if (!workerBase) {
        openApiSettings();
        throw new Error("กรุณาตั้งค่า Cloudflare Worker URL ก่อนใช้งาน");
      }

      setApiStatus("loading", "กำลังเชื่อมต่อ...");
      const response = await fetch(apiEndpoint(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, payload })
      });

      let data;
      const raw = await response.text();

      try {
        data = JSON.parse(raw);
      } catch {
        throw new Error("Worker ตอบกลับไม่ใช่ JSON (HTTP " + response.status + ")");
      }

      if (!response.ok || data.ok === false) {
        setApiStatus("bad", "API มีข้อผิดพลาด");
        throw new Error(data.error || "HTTP " + response.status);
      }

      const result = Object.prototype.hasOwnProperty.call(data, "result")
        ? data.result
        : data;

      if (result && result.ok === false) {
        setApiStatus("bad", "API มีข้อผิดพลาด");
        throw new Error(result.error || result.message || "Backend operation failed");
      }

      setApiStatus("ok", "เชื่อมต่อ Worker แล้ว");
      return result;
    }

    async function checkConnection() {
      if (!workerBase) {
        openApiSettings();
        return;
      }

      try {
        const result = await api("health", {});
        toast("เชื่อมต่อ API สำเร็จ · " + (result.version || "พร้อมใช้งาน"), "success");
      } catch (err) {
        setApiStatus("bad", "เชื่อมต่อไม่สำเร็จ");
        toast(err.message, "error");
      }
    }

    function openApiSettings() {
      openModal("ตั้งค่า Cloudflare Worker", `
        <div class="stack">
          <div class="notice">
            ใส่ URL หลักของ Worker เท่านั้น ไม่ต้องเติม <code>/api</code> และไม่ต้องใส่รหัสลับในหน้านี้
          </div>
          <div class="field">
            <label>Cloudflare Worker Base URL</label>
            <input class="input" id="workerUrlInput"
              placeholder="https://your-worker.your-subdomain.workers.dev"
              value="${escAttr(workerBase)}">
            <div class="help">ตัวอย่าง: https://line-ai-chatbot-api.example.workers.dev</div>
          </div>
          <div class="notice warn">
            URL นี้ไม่ใช่รหัสลับ แต่ Worker ต้องมีการป้องกันสิทธิ์ผู้ดูแลด้วย เพราะ CORS ไม่ใช่ระบบยืนยันตัวตน
          </div>
        </div>
      `, async () => {
        const value = document.getElementById("workerUrlInput").value.trim().replace(/\/+$/, "");
        if (!/^https:\/\/.+/.test(value)) throw new Error("กรุณาใส่ URL ที่ขึ้นต้นด้วย https://");
        workerBase = value;
        localStorage.setItem(API_STORAGE_KEY, workerBase);
        closeModal();
        toast("บันทึก Worker URL แล้ว", "success");
        checkConnection();
        renderPage(currentPage);
      }, "ทดสอบและบันทึก");
    }

    function openModal(title, bodyHtml, onSave, saveLabel = "บันทึก") {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      document.getElementById("modalSaveButton").textContent = saveLabel;
      document.getElementById("modalBackdrop").classList.add("open");
      currentModalSave = onSave || null;
      document.getElementById("modalSaveButton").style.display = onSave ? "" : "none";
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
      currentModalSave = null;
    }

    async function saveModal() {
      if (!currentModalSave) return;
      const button = document.getElementById("modalSaveButton");
      button.disabled = true;
      const oldText = button.textContent;
      button.textContent = "กำลังบันทึก...";
      try {
        await currentModalSave();
      } catch (err) {
        toast(err.message || String(err), "error");
      } finally {
        button.disabled = false;
        button.textContent = oldText;
      }
    }

    function toggleSidebar(force) {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      const shouldOpen = force === undefined ? !sidebar.classList.contains("open") : force;
      sidebar.classList.toggle("open", shouldOpen);
      overlay.classList.toggle("open", shouldOpen);
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.page === page);
      });
      const meta = PAGE_META[page] || ["ระบบ", ""];
      document.getElementById("pageTitle").textContent = meta[0];
      document.getElementById("pageSubtitle").textContent = meta[1];
      toggleSidebar(false);
      renderPage(page);
    }

    function loadingContent() {
      document.getElementById("mainContent").innerHTML =
        '<div class="card"><div class="loading"><span class="spinner"></span> กำลังโหลดข้อมูล...</div></div>';
    }

    async function renderPage(page) {
      if (page !== currentPage) return;
      if (!workerBase) {
        document.getElementById("mainContent").innerHTML = `
          <div class="card"><div class="card-body" style="padding:35px">
            <div class="stat-icon" style="float:none;margin-bottom:18px">⚙</div>
            <h2 style="margin:0 0 9px;font-size:22px">เชื่อมต่อ Cloudflare Worker</h2>
            <p class="muted" style="line-height:1.8;max-width:720px">
              ก่อนโหลด Dashboard ให้ใส่ URL ของ Cloudflare Worker ที่คุณ Deploy แล้ว
              ระบบจะเรียก API ผ่าน Worker ไปยัง Google Apps Script และ Google Sheets
            </p>
            <button class="btn btn-primary" onclick="openApiSettings()">ตั้งค่า Worker URL</button>
          </div></div>`;
        setApiStatus("bad", "ยังไม่ได้ตั้งค่า API");
        return;
      }

      loadingContent();

      try {
        const pageRenderers = {
          dashboard: renderDashboard,
          analytics: renderAnalytics,
          inbox: renderInbox,
          friends: renderFriends,
          handover: renderHandover,
          settings: renderSettings,
          prompts: renderPrompts,
          knowledge: renderKnowledge,
          profiles: renderProfiles,
          welcome: renderWelcome,
          automations: renderAutomations,
          safety: renderSafety,
          flex: renderFlexStudio,
          campaigns: renderCampaigns,
          loading: renderLoadingTool,
          richmenus: renderRichMenus,
          channels: renderChannels,
          jobs: renderJobs,
          logs: renderLogs
        };

        const fn = pageRenderers[page] || renderDashboard;
        await fn();
      } catch (err) {
        document.getElementById("mainContent").innerHTML = `
          <div class="card"><div class="card-body">
            <div class="notice danger"><strong>โหลดหน้าไม่สำเร็จ</strong><br>${esc(err.message || err)}</div>
            <div style="margin-top:15px" class="flex gap-8 wrap">
              <button class="btn btn-primary" onclick="renderPage(currentPage)">ลองใหม่</button>
              <button class="btn" onclick="openApiSettings()">ตรวจ Worker URL</button>
            </div>
          </div></div>`;
        setApiStatus("bad", "มีข้อผิดพลาด");
      }
    }

    async function loadTable(table, options = {}) {
      const key = "table:" + table;
      const result = await api("list", { table, limit: options.limit || 500, ...options });
      cache[key] = Array.isArray(result) ? result : [];
      return cache[key];
    }

    function emptyState(title, description = "ยังไม่มีข้อมูลในรายการนี้") {
      return `<div class="empty"><div class="empty-icon">◇</div><div class="empty-title">${esc(title)}</div><div>${esc(description)}</div></div>`;
    }

    function statCard(label, value, icon, note, color = "") {
      return `<div class="card stat-card">
        <div class="stat-icon ${color}">${icon}</div>
        <div class="stat-label">${esc(label)}</div>
        <div class="stat-value">${esc(fmtNumber(value))}</div>
        <div class="stat-note">${esc(note || "")}</div>
      </div>`;
    }

    function renderTable(table, rows, columns, options = {}) {
      if (!rows || !rows.length) return emptyState(options.emptyTitle || "ไม่พบข้อมูล", options.emptyText || "ลองเพิ่มข้อมูลหรือรีเฟรชรายการ");

      const header = columns.map(c => `<th>${esc(options.labels && options.labels[c] ? options.labels[c] : c)}</th>`).join("");
      const body = rows.map(row => {
        const cells = columns.map(column => {
          let value = row[column];

          if (column === "enabled" || column === "active" || column === "aiEnabled" || column === "selected") {
            return `<td>${boolBadge(value)}</td>`;
          }

          if (column.toLowerCase().includes("status")) {
            return `<td>${statusBadge(value)}</td>`;
          }

          if (column.toLowerCase().includes("at") || column === "timestamp" || column === "date" || column === "runAt") {
            return `<td>${esc(fmtDate(value))}</td>`;
          }

          if (column === "userId") {
            return `<td><span style="font:10px Consolas">${esc(value || "—")}</span></td>`;
          }

          return `<td title="${escAttr(pretty(value))}">${esc(shortText(value, 80))}</td>`;
        }).join("");

        const rowId = row.id || "";
        const actions = options.readOnly
          ? `<button class="btn btn-small" onclick="viewRecord('${escAttr(table)}','${escAttr(rowId)}')">ดู</button>`
          : `<button class="btn btn-small" onclick="editRecord('${escAttr(table)}','${escAttr(rowId)}')">แก้ไข JSON</button>
             <button class="btn btn-small btn-danger" onclick="deleteRecord('${escAttr(table)}','${escAttr(rowId)}')">ลบ</button>`;

        return `<tr>${cells}<td><div class="table-actions">${actions}</div></td></tr>`;
      }).join("");

      return `<div class="table-wrap"><table><thead><tr>${header}<th>การทำงาน</th></tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function genericTablePage(title, table, description = "", opts = {}) {
      return loadTable(table, { limit: opts.limit || 500 }).then(rows => {
        cache["table:" + table] = rows;
        const columns = opts.columns || TABLE_COLUMNS[table] || ["id", "name", "updatedAt"];
        document.getElementById("mainContent").innerHTML = `
          <div class="page-tools">
            <div class="muted small">${esc(description || "จัดการข้อมูลจาก Google Sheets")}</div>
            <div class="grow"></div>
            ${opts.newRecord === false ? "" : `<button class="btn btn-primary" onclick="newRecord('${escAttr(table)}')">＋ เพิ่มข้อมูล</button>`}
            <button class="btn" onclick="renderPage(currentPage)">⟳ รีเฟรช</button>
          </div>
          <div class="card">
            <div class="card-header"><div><h3 class="card-title">${esc(title)}</h3><div class="card-desc">ทั้งหมด ${fmtNumber(rows.length)} รายการ${opts.readOnly ? " · อ่านอย่างเดียว" : ""}</div></div></div>
            ${renderTable(table, rows, columns, { readOnly: opts.readOnly, labels: opts.labels })}
          </div>`;
      });
    }

    async function renderDashboard() {
      const data = await api("dashboard", {});
      const totals = data.totals || {};
      document.getElementById("mainContent").innerHTML = `
        <div class="page-tools">
          <div class="muted small">อัปเดตข้อมูล ${esc(fmtDate(data.generatedAt))}</div>
          <div class="grow"></div>
          <button class="btn" onclick="apiActionAndRefresh('setup',{},'ตรวจสอบ/เตรียมฐานข้อมูลแล้ว')">↻ ตรวจสอบตาราง</button>
          <button class="btn btn-primary" onclick="checkConnection()">ทดสอบ API</button>
        </div>
        <div class="grid stats-grid">
          ${statCard("ผู้ติดตามในฐานข้อมูล", totals.friends || 0, "♙", "Friends / Customers", "blue")}
          ${statCard("ข้อความทั้งหมด", totals.messages || 0, "▤", "Chat Logs", "")}
          ${statCard("ข้อความวันนี้", totals.messagesToday || 0, "↗", "ข้อมูลตามวันที่ในระบบ", "green")}
          ${statCard("แคมเปญที่กำลังทำงาน", totals.activeCampaigns || 0, "➤", "Queued / Scheduled / Sending", "orange")}
        </div>
        <div class="grid grid-2 section-gap">
          <div class="card">
            <div class="card-header"><div><h3 class="card-title">สถานะระบบ</h3><div class="card-desc">การตั้งค่าหลักจาก Google Sheets</div></div></div>
            <div class="card-body stack">
              <div class="flex justify-between align-center"><span>AI Chat</span>${boolBadge(data.config && data.config.aiEnabled)}</div>
              <div class="flex justify-between align-center"><span>Welcome Flow</span>${boolBadge(data.config && data.config.welcomeEnabled)}</div>
              <div class="flex justify-between align-center"><span>Knowledge Base</span>${boolBadge(data.config && data.config.knowledgeEnabled)}</div>
              <div class="flex justify-between align-center"><span>คิวส่งต่อเจ้าหน้าที่</span><span class="badge ${Number(totals.openHandovers || 0) ? "orange" : "green"}">${fmtNumber(totals.openHandovers || 0)} รายการ</span></div>
              <hr class="divider">
              <div class="flex gap-8 wrap">
                <button class="btn btn-primary" onclick="navigate('friends')">เปิดรายชื่อเพื่อน</button>
                <button class="btn" onclick="navigate('flex')">Flex Studio</button>
                <button class="btn" onclick="navigate('inbox')">Chat Inbox</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><div><h3 class="card-title">เริ่มต้นใช้งาน</h3><div class="card-desc">ลำดับการตั้งค่าที่แนะนำ</div></div></div>
            <div class="card-body stack">
              <div class="flex gap-12"><span class="badge purple">01</span><div><strong>ตรวจสอบการเชื่อมต่อ</strong><div class="muted small">ทดสอบ Worker → Apps Script</div></div></div>
              <div class="flex gap-12"><span class="badge purple">02</span><div><strong>ซิงก์รายชื่อเพื่อน</strong><div class="muted small">ดึง User ID แล้วเติมข้อมูลโปรไฟล์</div></div></div>

    function toBool(value) {
      return value === true || String(value).toLowerCase() === "true" || String(value) === "1";
    }

    function toggleFriend(userId, checked) {
      if (!userId) return;
      if (checked) selectedUserIds.add(userId);
      else selectedUserIds.delete(userId);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const el = document.getElementById("selectedCount");
      if (el) el.textContent = "เลือกแล้ว " + fmtNumber(selectedUserIds.size) + " คน";
    }

    function selectCurrentPage(checked) {
      const rows = cache.friendRows || [];
      rows.forEach(friend => {
        const id = String(friend.userId || "");
        if (!id) return;
        if (checked) selectedUserIds.add(id);
        else selectedUserIds.delete(id);
      });
      renderFriends().catch(err => toast(err.message, "error"));
    }

    function changeFriendPage(step) {
      friendsOffset = Math.max(0, friendsOffset + step * 100);
      renderFriends().catch(err => toast(err.message, "error"));
    }

    function debouncedFriendSearch() {
      clearTimeout(friendsSearchTimer);
      friendsOffset = 0;
      friendsSearchTimer = setTimeout(() => renderFriends().catch(err => toast(err.message, "error")), 300);
    }

      try {
        const result = await api("syncFriendsFromLINE", { limit: 100, maxPages: 1 });
        toast(`ซิงก์แล้ว ${result.idsSeen || 0} IDs · เพิ่ม ${result.idsAdded || 0} รายชื่อ${result.hasMore ? " · ยังมีข้อมูลต่อ ให้กดซิงก์อีกครั้ง" : ""}`, "success");
        await renderFriends();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function syncProfiles() {
      try {
        const result = await api("syncFriendProfiles", { limit: 20 });
        toast(`เติมโปรไฟล์แล้ว ${result.updated || 0} รายชื่อ · ข้าม ${result.skipped || 0}`, "success");

              </div>

    function chooseFlexTemplate(id) {
      const select = document.getElementById("flexTemplateSelect");
      if (select) {
        select.value = id;
        loadFlexTemplate();
      }
    }

    function loadFlexTemplate() {
      const id = document.getElementById("flexTemplateSelect")?.value || "";
      const item = (cache.flexTemplates || []).find(t => String(t.id) === id);
      if (!item) return;
      document.getElementById("flexAltText").value = item.altText || item.name || "ข้อความจาก LINE";
      document.getElementById("flexJson").value = JSON.stringify(item.contents || {}, null, 2);
      const result = document.getElementById("flexValidation");
      if (result) result.innerHTML = `<div class="notice success">โหลด Template “${esc(item.name)}” แล้ว</div>`;
    }

    function parseFlexForm() {
      const altText = document.getElementById("flexAltText")?.value.trim() || "ข้อความจาก LINE";
      const raw = document.getElementById("flexJson")?.value || "";
      let contents;
      try {
        contents = JSON.parse(raw);
      } catch (err) {
        throw new Error("Flex JSON ไม่ถูกต้อง: " + err.message);
      }
      if (!contents || typeof contents !== "object" || Array.isArray(contents)) {
        throw new Error("Flex Contents ต้องเป็น JSON object");
      }
      if (!contents.type) throw new Error("Flex Contents ต้องมี type เช่น bubble หรือ carousel");
      return { altText, contents };
    }

    function validateFlexJson() {
      const target = document.getElementById("flexValidation");

    function uploadRichImage(richMenuId) {
      if (!richMenuId) {
        toast("ไม่มี Rich Menu ID", "error");
        return;
      }
      openModal("อัปโหลดภาพ Rich Menu", `
        <div class="stack">
          <div class="notice">เลือกไฟล์ PNG หรือ JPEG ที่ตรงกับขนาดและข้อกำหนดของ LINE Rich Menu</div>
          <div class="field"><label>ไฟล์ภาพ</label><input class="input" id="richImageFile" type="file" accept="image/png,image/jpeg"></div>
        </div>
      `, async () => {
        const file = document.getElementById("richImageFile").files[0];
        if (!file) throw new Error("กรุณาเลือกไฟล์ภาพ");
        if (!["image/png","image/jpeg"].includes(file.type)) throw new Error("รองรับเฉพาะ PNG/JPEG");
        const base64 = await fileToBase64(file);
        await api("uploadRichMenuImage", { richMenuId, imageBase64: base64, contentType: file.type });
        closeModal();
        toast("อัปโหลดภาพสำเร็จ", "success");
        renderRichMenus();
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.readAsDataURL(file);
      });
    }

        const result = await api("getAnalytics", { days });
        const daily = result.daily || [];
        const max = Math.max(1, ...daily.map(d => Number(d.total || 0)));
        const container = document.querySelector(".chart-bars");
        if (container) {
          container.innerHTML = daily.map(d => `
            <div class="chart-col" title="${esc(d.date)}: ${fmtNumber(d.total)}">
              <div class="chart-value">${fmtNumber(d.total)}</div>
              <div class="chart-bar" style="height:${Math.max(2,(Number(d.total||0)/max)*125)}px"></div>
              <div class="chart-label">${esc(String(d.date||"").slice(5))}</div>
            </div>`).join("");
        }
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function renderLogs() {
      document.getElementById("mainContent").innerHTML = `
        <div class="page-tools">
          <div class="field" style="min-width:220px"><label>เลือกตาราง Log</label><select class="select" id="logTableSelect" onchange="loadLogTable()">
            <option value="SystemLogs">SystemLogs</option>
            <option value="AdminLogs">AdminLogs</option>
            <option value="ChatLogs">ChatLogs</option>
            <option value="WebhookEvents">WebhookEvents</option>
            <option value="BroadcastLogs">BroadcastLogs</option>
            <option value="UsageStats">UsageStats</option>
          </select></div>
          <div class="grow"></div>
          <button class="btn" onclick="exportSelectedLogs()">ส่งออก CSV</button>
          <button class="btn" onclick="loadLogTable()">⟳ รีเฟรช</button>
        </div>
        <div class="card"><div class="card-header"><div><h3 class="card-title" id="logsTitle">SystemLogs</h3><div class="card-desc">ตาราง Logs เป็นโหมดอ่านอย่างเดียวจากหน้านี้</div></div></div><div id="logTableContent"><div class="loading"><span class="spinner"></span></div></div></div>`;
      await loadLogTable();
    }

    async function loadLogTable() {
      const table = document.getElementById("logTableSelect")?.value || "SystemLogs";
      const target = document.getElementById("logTableContent");
      if (!target) return;
      target.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
      try {
        const rows = await loadTable(table, { limit: 500 });
        document.getElementById("logsTitle").textContent = table;
        const columns = TABLE_COLUMNS[table] || ["id", "timestamp"];
        target.innerHTML = renderTable(table, rows, columns, { readOnly: true });
      } catch (err) {
        target.innerHTML = `<div class="card-body"><div class="notice danger">${esc(err.message)}</div></div>`;
      }
    }

    async function exportSelectedLogs() {
      const table = document.getElementById("logTableSelect")?.value || "SystemLogs";
      try {
        const result = await api("exportTableCsv", { table });
        const blob = new Blob([result.csv || ""], { type: result.contentType || "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = result.filename || table + ".csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        toast("ส่งออก CSV แล้ว", "success");
      } catch (err) {
        toast(err.message, "error");
      }
    }

    function viewRecord(table, id) {
      const rows = cache["table:" + table] || [];
      const row = rows.find(r => String(r.id) === String(id)) || {};
      openModal("รายละเอียด " + table, `<div class="json-preview">${esc(JSON.stringify(row,null,2))}</div>`, null);
    }

    function editRecord(table, id) {
      const rows = cache["table:" + table] || [];
      const row = rows.find(r => String(r.id) === String(id));
      if (!row) {
        toast("ไม่พบข้อมูลใน cache กรุณารีเฟรช", "error");
        return;
      }
      openJsonRecordEditor(table, row);
    }

    function newRecord(table) {
      const initial = {};
      openJsonRecordEditor(table, initial);
    }

    function openJsonRecordEditor(table, record) {
      const isNew = !record.id;
      const body = `
        <div class="stack">
          <div class="notice">แก้ไขเฉพาะ field ที่ตรงกับหัวตารางของ ${esc(table)} ระบบจะเก็บข้อมูล JSON ในรูปแบบที่ Code.gs รองรับ และรักษา ID เดิมเมื่อเป็นการแก้ไข</div>
          <div class="field"><label>Record JSON</label><textarea class="textarea code" id="recordJson" style="min-height:390px">${esc(JSON.stringify(record,null,2))}</textarea></div>
        </div>`;
      openModal((isNew ? "เพิ่มข้อมูล " : "แก้ไขข้อมูล ") + table, body, async () => {
        let parsed;
        try { parsed = JSON.parse(document.getElementById("recordJson").value); }
        catch { throw new Error("JSON ไม่ถูกต้อง"); }
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          throw new Error("Record ต้องเป็น JSON object");
        }
        const saved = await api("save", { table, record: parsed });
        closeModal();
        toast("บันทึก " + table + " แล้ว", "success");
        cache["table:" + table] = await loadTable(table, { limit: 1000 });
        renderPage(currentPage);
        return saved;
      });
    }

    async function deleteRecord(table, id) {
      if (!confirm("ยืนยันลบข้อมูล " + table + " นี้หรือไม่?")) return;
      try {
        await api("delete", { table, id });
        toast("ลบข้อมูลแล้ว", "success");
        renderPage(currentPage);
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function apiActionAndRefresh(action, payload, message) {
      try {
        await api(action, payload || {});
        toast(message || "ดำเนินการสำเร็จ", "success");
        await renderPage(currentPage);
      } catch (err) {
        toast(err.message, "error");
      }
    }

    /* =========================================================================
       Small helpers / initial boot
       ========================================================================= */

    function setupModalEscape() {
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeModal();
      });
    }

    async function boot() {
      setupModalEscape();

      if (!workerBase) {
        setApiStatus("bad", "ยังไม่ได้ตั้งค่า API");
        navigate("dashboard");
        setTimeout(() => openApiSettings(), 300);
        return;
      }

      try {
        setApiStatus("loading", "กำลังเริ่มต้น...");
        await api("bootstrap", {});
        await renderPage("dashboard");
      } catch (err) {
        setApiStatus("bad", "โหลดข้อมูลไม่ได้");
        document.getElementById("mainContent").innerHTML = `
          <div class="card"><div class="card-body" style="padding:28px">
            <div class="notice danger"><strong>เชื่อมต่อ Backend ไม่สำเร็จ</strong><br>${esc(err.message)}</div>
            <div class="section-gap flex gap-8 wrap">
              <button class="btn btn-primary" onclick="checkConnection()">ทดสอบอีกครั้ง</button>
              <button class="btn" onclick="openApiSettings()">แก้ไข Worker URL</button>
            </div>
            <div class="section-gap small muted">ตรวจสอบว่า Worker URL ลงท้ายด้วยโดเมน workers.dev หรือ custom domain ที่ Deploy แล้ว และ Worker มีตัวแปร GAS_WEB_APP_URL, WORKER_SHARED_SECRET, ALLOWED_ORIGIN ครบ</div>
          </div></div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", boot);
  </script>
</body>
